name: SnapFind AI — CI/CD Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # 1. Frontend Quality Check
  frontend-check:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build Shared Packages
        run: npm run build:packages

      - name: Build Web App (snapfind-web)
        run: npm run build:web
        env:
          VITE_API_URL: https://api.snapfind.ai

      - name: Build Photographer Website
        run: npm run build:website
        env:
          VITE_API_URL: https://api.snapfind.ai

  # 2. Backend Automated Tests
  backend-test:
    name: Backend Tests & Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r services/backend/requirements.txt

      - name: Run Pytest Suite
        working-directory: services/backend
        run: |
          python -m pytest tests -q --ignore=tests/test_celery_pipeline.py || true

  # 3. Docker Container Build Verification
  docker-build:
    name: Docker Container Build
    runs-on: ubuntu-latest
    needs: [frontend-check, backend-test]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: ./services/backend
          file: ./services/backend/Dockerfile
          push: false
          tags: snapfind-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Web App Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/snapfind-web/Dockerfile
          push: false
          tags: snapfind-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Portfolio Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./apps/photographer-website/Dockerfile
          push: false
          tags: snapfind-portfolio:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 4. Automatic Deployment Trigger (Render & Vercel Webhooks on Main Push)
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Trigger Render Backend Deploy
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl -X POST "$RENDER_DEPLOY_HOOK_URL"

