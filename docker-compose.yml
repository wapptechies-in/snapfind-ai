services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: snapfind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: snapfind_ai
      POSTGRES_USER: snapfind_user
      POSTGRES_PASSWORD: snapfind_password
    ports:
      - "5432:5432"
    volumes:
      - snapfind_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U snapfind_user -d snapfind_ai"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: snapfind-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - snapfind_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: snapfind-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - snapfind_miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  create-bucket:
    image: minio/mc:latest
    container_name: snapfind-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 minioadmin minioadminpassword;
      /usr/bin/mc mb --ignore-existing local/snapfind-photos;
      /usr/bin/mc anonymous set download local/snapfind-photos;
      exit 0;
      "

  backend:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    container_name: snapfind-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://snapfind_user:snapfind_password@postgres:5432/snapfind_ai
      ENVIRONMENT: production
      API_HOST: 0.0.0.0
      API_PORT: 8000
      SECRET_KEY: snapfind_super_secure_production_secret_key_2026
      CORS_ORIGINS: http://localhost:5173,http://localhost:3000,http://localhost:80
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadminpassword
      S3_BUCKET_NAME: snapfind-photos
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    container_name: snapfind-worker
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker -l info --concurrency=4
    environment:
      DATABASE_URL: postgresql+psycopg://snapfind_user:snapfind_password@postgres:5432/snapfind_ai
      ENVIRONMENT: production
      STORAGE_BACKEND: s3
      S3_ENDPOINT_URL: http://minio:9000
      S3_PUBLIC_ENDPOINT_URL: http://localhost:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadminpassword
      S3_BUCKET_NAME: snapfind-photos
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    build:
      context: ./apps/snapfind-web
      dockerfile: Dockerfile
    container_name: snapfind-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  snapfind_pgdata:
  snapfind_redisdata:
  snapfind_miniodata:
