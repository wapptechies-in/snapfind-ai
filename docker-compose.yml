services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: snapfind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-snapfind_ai}
      POSTGRES_USER: ${POSTGRES_USER:-snapfind_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-snapfind_password}
    ports:
      - "5432:5432"
    volumes:
      - snapfind_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-snapfind_user} -d ${POSTGRES_DB:-snapfind_ai}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: snapfind-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - snapfind_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: snapfind-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-minioadminpassword}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - snapfind_miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  create-bucket:
    image: minio/mc:latest
    container_name: snapfind-minio-setup
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set local http://minio:9000 $${STORAGE_ACCESS_KEY:-minioadmin} $${STORAGE_SECRET_KEY:-minioadminpassword};
      /usr/bin/mc mb --ignore-existing local/$${STORAGE_BUCKET_NAME:-snapfind-photos};
      /usr/bin/mc anonymous set download local/$${STORAGE_BUCKET_NAME:-snapfind-photos};
      exit 0;
      "

  backend:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    container_name: snapfind-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-snapfind_user}:${POSTGRES_PASSWORD:-snapfind_password}@postgres:5432/${POSTGRES_DB:-snapfind_ai}
      ENVIRONMENT: development
      API_HOST: 0.0.0.0
      API_PORT: 8000
      SECRET_KEY: ${SECRET_KEY:-snapfind-secret-jwt-key-for-dev-only-change-in-prod-2026}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:3000}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-s3}
      STORAGE_ENDPOINT_URL: ${STORAGE_ENDPOINT_URL:-http://minio:9000}
      STORAGE_PUBLIC_ENDPOINT_URL: ${STORAGE_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-minioadmin}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-minioadminpassword}
      STORAGE_BUCKET_NAME: ${STORAGE_BUCKET_NAME:-snapfind-photos}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    build:
      context: ./services/backend
      dockerfile: Dockerfile
    container_name: snapfind-worker
    restart: unless-stopped
    command: celery -A app.workers.celery_app worker -l info --concurrency=${CELERY_WORKER_CONCURRENCY:-2}
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-snapfind_user}:${POSTGRES_PASSWORD:-snapfind_password}@postgres:5432/${POSTGRES_DB:-snapfind_ai}
      ENVIRONMENT: development
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-s3}
      STORAGE_ENDPOINT_URL: ${STORAGE_ENDPOINT_URL:-http://minio:9000}
      STORAGE_PUBLIC_ENDPOINT_URL: ${STORAGE_PUBLIC_ENDPOINT_URL:-http://localhost:9000}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-minioadmin}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-minioadminpassword}
      STORAGE_BUCKET_NAME: ${STORAGE_BUCKET_NAME:-snapfind-photos}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: ./apps/snapfind-web/Dockerfile
    container_name: snapfind-web
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  snapfind_pgdata:
  snapfind_redisdata:
  snapfind_miniodata:
